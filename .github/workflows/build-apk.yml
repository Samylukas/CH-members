name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
          cp logo.png www/ 2>/dev/null || true
          cp "ch logo.png" www/logo.png 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "ChurchApp" "com.church.management" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel -Dorg.gradle.vfs.watch=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Church-Management-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
