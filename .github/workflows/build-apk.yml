name: Build Android APK (ChurchApp)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets (www)
        run: |
          mkdir -p www
          cp index.html app.js style.css logo.png manifest.json sw.js www/

      - name: Initialize Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          npx cap init "ChurchApp" "com.church.members" --web-dir www
          npx cap add android

      - name: Generate Android App Icon from logo.png
        run: |
          mkdir -p assets
          cp logo.png assets/icon-only.png
          cp logo.png assets/icon-foreground.png
          cp logo.png assets/splash.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#ffffff'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChurchApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
