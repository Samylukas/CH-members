<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>منظومة الخدمة والرعاية الكنسية</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; } .dashboard-card { border-radius: 12px; background: white; border: 2px solid transparent; transition: all 0.3s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); } .dashboard-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); } /* تخصيص ألوان حدود الكروت حسب النوع لمحاكاة الصورة المرفقة */ .card-names { border-color: #2e7d32; } .card-names .card-icon { color: #2e7d32; } .card-visitations { border-color: #d32f2f; } .card-visitations .card-icon { color: #d32f2f; } .card-meetings { border-color: #fbc02d; } .card-meetings .card-icon { color: #fbc02d; } .card-sunday { border-color: #1565c0; } .card-sunday .card-icon { color: #1565c0; } .card-servants { border-color: #7b1fa2; } .card-servants .card-icon { color: #7b1fa2; } .custom-scrollbar::-webkit-scrollbar { width: 6px; } .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }</style></head><body class="flex flex-col min-h-screen text-slate-800">

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4 backdrop-blur-md"><div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md text-center"><i class="fa-solid fa-church text-5xl text-indigo-700 mb-4 block"></i><h2 class="text-2xl font-extrabold text-slate-800 mb-1">بوابة الخدام</h2><p class="text-sm text-slate-500 mb-6 font-semibold">الرجاء تسجيل الدخول للمتابعة</p><form onsubmit="handleLogin(event)" class="space-y-4 text-right"><div class="relative"><i class="fa-solid fa-user absolute right-3 top-3.5 text-slate-400"></i><input type="text" id="loginUser" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition font-semibold" placeholder="اسم المستخدم"></div><div class="relative"><i class="fa-solid fa-lock absolute right-3 top-3.5 text-slate-400"></i><input type="password" id="loginPass" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition font-semibold" placeholder="كلمة المرور"></div><button type="submit" id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md transition duration-200">تسجيل الدخول</button><p id="loginError" class="text-sm text-red-500 font-bold hidden text-center"></p></form></div></div>

<!-- الهيدر الرئيسي -->
<header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40"><div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700"><i class="fa-solid fa-cross text-xl"></i></div><div><h1 class="text-lg font-extrabold text-slate-800 leading-tight">منظومة الخدمة والرعاية</h1><p class="text-[11px] text-slate-500 font-semibold" id="userBadge"></p></div></div><div class="flex items-center gap-2"><button onclick="showDashboard()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition"><i class="fa-solid fa-house ml-1"></i> الرئيسية</button><button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-bold transition"><i class="fa-solid fa-arrow-right-from-bracket ml-1"></i> خروج</button></div></div></header>

<main class="flex-grow w-full max-w-7xl mx-auto px-4 py-8">
    <!-- لوحة التحكم الرئيسية (تظهر عند اختيار "الرئيسية" أو عند تسجيل الدخول) -->
    <div id="dashboardView" class="block"><div class="text-center mb-10"><h2 class="text-3xl font-extrabold text-slate-800 mb-2">لوحة التحكم الرئيسية</h2><p class="text-slate-500 font-semibold text-lg">اختر القسم الذي تود إدارته</p></div><div id="dashboardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-5xl mx-auto"></div></div>

    <!-- عرض البيانات (يظهر عند اختيار أحد الكروت) -->
    <div id="dataView" class="hidden"><div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6"><div class="flex-grow w-full"><h2 id="currentTabTitle" class="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"></h2><div class="relative w-full max-w-md"><i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-slate-400"></i><input type="text" id="searchInput" oninput="renderDataCards()" placeholder="بحث في السجلات..." class="w-full pr-11 pl-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm font-semibold"></div></div><div class="flex gap-2 w-full md:w-auto"><span id="recordCount" class="bg-slate-200 text-slate-700 px-4 py-3 rounded-xl font-bold text-sm flex items-center shadow-sm">0 سجل</span><button onclick="openModal('add')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2"><i class="fa-solid fa-plus"></i> إضافة سجل جديد</button></div></div><div id="loader" class="hidden text-center py-20"><i class="fa-solid fa-circle-notch fa-spin text-5xl text-indigo-600 mb-4"></i><p class="text-slate-600 font-bold text-lg">جاري التحميل...</p></div><div id="dataCardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div></div>
</main>

<!-- نافذة الإضافة والتعديل -->
<div id="dataModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm"><div class="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden"><div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50"><h3 id="modalTitle" class="text-xl font-extrabold text-slate-800 flex items-center gap-2"></h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 transition bg-slate-200 hover:bg-slate-300 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark text-lg"></i></button></div><form id="recordForm" onsubmit="handleFormSubmit(event)" class="overflow-y-auto p-6 space-y-6 custom-scrollbar flex-grow bg-white"><input type="hidden" id="formAction"><input type="hidden" id="recordId"><div id="formFields" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div><div class="pt-6 border-t border-slate-100 flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-6 py-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold transition">إلغاء</button><button type="submit" id="saveBtn" class="px-8 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md transition flex items-center gap-2"><i class="fa-solid fa-check"></i> حفظ البيانات</button></div></form></div></div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxUSj07z5nkCv88hrgob88-bB21SLs2OmK9-BbSSUu_4m2eirI8cBHCl-5xUv0cyTSZ6Q/exec";
    let currentUser = null, currentTab = "", rawData = [];
    const STAGE_GRADES = { "حضانة": ["بيبي كلاس", "أولى حضانة", "ثانية حضانة"], "ابتدائي": ["الصف الأول", "الصف الثاني", "الصف الثالث", "الصف الرابع", "الصف الخامس", "الصف السادس"], "إعدادي": ["الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي"], "ثانوي": ["الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"], "جامعي": ["الفرقة الأولى", "الفرقة الثانية", "الفرقة الثالثة", "الفرقة الرابعة", "بكالوريوس / تخرج"], "خريجين": ["خريج"] };
    
    // تعريف خصائص الأقسام (التبويبات) لتصميم كروت الداشبورد
    const TABS_INFO = {
        "Names": { label: "المخدومين", desc: "السجل الأساسي للمخدومين", icon: "fa-users", colorClass: "card-names", roles: ["Admin", "SundaySchool_Admin"] },
        "Visitations": { label: "سجل الافتقاد", desc: "متابعة الزيارات والافتقاد", icon: "fa-house-chimney-user", colorClass: "card-visitations", roles: ["Admin"] },
        "Meetings_Attendance": { label: "الاجتماعات", desc: "تسجيل حضور الاجتماعات العامة", icon: "fa-clipboard-user", colorClass: "card-meetings", roles: ["Admin"] },
        "Sunday_School": { label: "مدارس الأحد", desc: "إدارة الحضور والتقييم", icon: "fa-children", colorClass: "card-sunday", roles: ["Admin", "SundaySchool_Admin", "Stage_Leader", "Class_Servant"] },
        "Servants": { label: "إدارة الخدام", desc: "صلاحيات وحسابات الخدام", icon: "fa-user-shield", colorClass: "card-servants", roles: ["Admin"] }
    };

    const SCHEMAS = {
        "Names": [ { id: "اسم رب الاسرة", label: "اسم رب الأسرة", type: "text" }, { id: "الاسم ثلاثي", label: "الاسم ثلاثي", type: "text", required: true }, { id: "ذكر/انثي", label: "النوع", type: "select", options: ["", "ذكر", "انثي"], required: true }, { id: "صلة القرابة", label: "صلة القرابة", type: "select", options: ["", "زوج", "زوجة", "ابن", "ابنة", "والد", "والدة", "أخ", "أخت", "أخرى"] }, { id: "الحالة الاجتماعية", label: "الحالة الاجتماعية", type: "select", options: ["", "متزوج", "متزوجة", "اعزب", "انسة", "ارمل", "ارملة"] }, { id: "المرحلة", label: "المرحلة الدراسية", type: "stage_select", options: Object.keys(STAGE_GRADES) }, { id: "الصف", label: "الصف الدراسي", type: "grade_select" }, { id: "فصل مدارس الاحد", label: "فصل مدارس الأحد", type: "text" }, { id: "تليفون العمل/المحمول", label: "المحمول / الهاتف", type: "text" }, { id: "الرقم القومي", label: "الرقم القومي", type: "text" }, { id: "تاريخ الميلاد", label: "تاريخ الميلاد (DD/MM/YYYY)", type: "text" }, { id: "تاريخ الزواج", label: "تاريخ الزواج (DD/MM/YYYY)", type: "text" }, { id: "البطاقة الانتخابية", label: "البطاقة الانتخابية", type: "select", options: ["", "يوجد", "لا يوجد"] }, { id: "المؤهل", label: "المؤهل الدراسي", type: "text" }, { id: "المهنة/السنة الدراسية", label: "المهنة / العمل", type: "text" }, { id: "اب الاعتراف", label: "أب الاعتراف", type: "text" }, { id: "الخادم الروحي", label: "الخادم الروحي", type: "text" }, { id: "المواظبة على حضور القداس", label: "حضور القداس", type: "select", options: ["", "بانتظام", "أحياناً", "منقطع"] }, { id: "المواظبة على حضور الاجتماع", label: "حضور الاجتماع", type: "select", options: ["", "بانتظام", "أحياناً", "منقطع"] }, { id: "الرتبة الكنسية", label: "الرتبة الكنسية", type: "select", options: ["", "شعب", "إبصلتس", "أغنسطس", "إيبودياكون", "دياكون", "شماسة"] }, { id: "الموعد المناسب للافتقاد", label: "موعد الافتقاد المناسب", type: "text" }, { id: "ملاحظات", label: "ملاحظات عامة", type: "textarea", full: true } ],
        "Sunday_School": [ { id: "Stage", label: "المرحلة", type: "stage_select", options: Object.keys(STAGE_GRADES), required: true }, { id: "Grade", label: "الصف", type: "grade_select", required: true }, { id: "ClassName", label: "اسم الفصل", type: "text", required: true }, { id: "SessionDate", label: "تاريخ الدرس (DD/MM/YYYY)", type: "text", required: true }, { id: "ChildID", label: "كود المخدوم (ID)", type: "number" }, { id: "ChildName", label: "اسم الطفل", type: "text", required: true }, { id: "ServantName", label: "اسم الخادم", type: "text" }, { id: "Attendance", label: "الحضور", type: "select", options: ["حاضر", "غائب"] }, { id: "Memorization", label: "الحفظ", type: "select", options: ["ممتاز", "جيد", "ضعيف", "لم يحفظ"] }, { id: "Points", label: "النقاط", type: "number" }, { id: "Notes", label: "ملاحظات", type: "textarea", full: true } ],
        "Visitations": [ { id: "MemberID", label: "كود المخدوم", type: "number", required: true }, { id: "MemberName", label: "اسم المخدوم", type: "text", required: true }, { id: "VisitDate", label: "تاريخ الافتقاد (DD/MM/YYYY)", type: "text", required: true }, { id: "VisitorName", label: "اسم الخادم", type: "text", required: true }, { id: "VisitType", label: "نوع الافتقاد", type: "select", options: ["منزلي", "تليفوني", "كنسي", "أخرى"] }, { id: "FollowUpDate", label: "تاريخ المتابعة (DD/MM/YYYY)", type: "text" }, { id: "Notes", label: "تقرير وملاحظات", type: "textarea", full: true } ],
        "Meetings_Attendance": [ { id: "MeetingName", label: "اسم الاجتماع", type: "text", required: true }, { id: "MeetingDate", label: "التاريخ (DD/MM/YYYY)", type: "text", required: true }, { id: "MemberID", label: "كود العضو", type: "number" }, { id: "MemberName", label: "الاسم", type: "text", required: true }, { id: "Status", label: "الحالة", type: "select", options: ["حاضر", "معتذر", "غائب"] }, { id: "Notes", label: "ملاحظات", type: "textarea", full: true } ],
        "Servants": [ { id: "ServantName", label: "اسم الخادم", type: "text", required: true }, { id: "Username", label: "اسم المستخدم / الموبايل", type: "text", required: true }, { id: "Password", label: "كلمة المرور", type: "text", required: true }, { id: "Role", label: "الصلاحية", type: "select", options: ["Admin", "SundaySchool_Admin", "Stage_Leader", "Class_Servant"] }, { id: "AssignedStage", label: "المرحلة المسندة", type: "select", options: ["الكل", ...Object.keys(STAGE_GRADES)] }, { id: "AssignedGrade", label: "الصف المسند", type: "text" }, { id: "AssignedClass", label: "الفصل المسند", type: "text" }, { id: "Status", label: "الحالة", type: "select", options: ["نشط", "موقوف"] } ]
    };

    window.onload = () => { const saved = localStorage.getItem('church_servant'); if (saved) { currentUser = JSON.parse(saved); initApp(); } };
    
    async function handleLogin(e) { e.preventDefault(); const btn = document.getElementById('loginBtn'); const err = document.getElementById('loginError'); btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin ml-2"></i> جاري التحقق...`; err.classList.add('hidden'); try { const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', data: { username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value } }) }); const data = await res.json(); if (data.status === "success") { currentUser = data.user; localStorage.setItem('church_servant', JSON.stringify(currentUser)); initApp(); } else { err.innerText = data.message; err.classList.remove('hidden'); } } catch (error) { err.innerText = "فشل الاتصال بالخادم، تأكد من الإنترنت."; err.classList.remove('hidden'); } finally { btn.innerText = "تسجيل الدخول"; } }
    
    function logout() { localStorage.removeItem('church_servant'); location.reload(); }
    
    function initApp() { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('userBadge').innerHTML = `<span>مرحباً، <span class="font-bold">${currentUser.ServantName}</span></span> <span class="bg-indigo-800 px-2 py-0.5 rounded ml-2 font-mono">${currentUser.Role}</span>`; buildDashboard(); showDashboard(); }
    
    function buildDashboard() { const grid = document.getElementById('dashboardGrid'); grid.innerHTML = ""; Object.keys(TABS_INFO).forEach(key => { const info = TABS_INFO[key]; if (info.roles.includes(currentUser.Role)) { const card = document.createElement('div'); card.className = `dashboard-card ${info.colorClass} p-8 flex flex-col items-center justify-center text-center cursor-pointer min-h-[220px]`; card.onclick = () => loadSection(key); card.innerHTML = `<i class="fa-solid ${info.icon} text-6xl card-icon mb-4"></i><h3 class="text-xl font-extrabold text-slate-800 mb-2">${info.label}</h3><p class="text-sm text-slate-500 font-semibold">${info.desc}</p>`; grid.appendChild(card); } }); }
    
    function showDashboard() { document.getElementById('dataView').classList.add('hidden'); document.getElementById('dashboardView').classList.remove('hidden'); currentTab = ""; }
    
    function loadSection(sectionKey) { currentTab = sectionKey; document.getElementById('dashboardView').classList.add('hidden'); document.getElementById('dataView').classList.remove('hidden'); const info = TABS_INFO[sectionKey]; document.getElementById('currentTabTitle').innerHTML = `<i class="fa-solid ${info.icon} text-indigo-600 ml-2"></i> ${info.label}`; document.getElementById('searchInput').value = ""; loadData(); }
    
    async function loadData() { showLoader(true); try { const res = await (await fetch(`${API_URL}?sheet=${currentTab}`)).json(); if (res.status === "success") { rawData = res.data; renderDataCards(); } else { alert("خطأ: " + res.message); } } catch (err) { alert("تعذر جلب البيانات"); } finally { showLoader(false); } }
    
    function renderDataCards() { const query = document.getElementById('searchInput').value.trim().toLowerCase(); const container = document.getElementById('dataCardsContainer'); container.innerHTML = ""; let filtered = rawData.filter(item => { if (currentTab === "Sunday_School") { if (currentUser.Role === "Stage_Leader" && currentUser.AssignedStage !== "الكل" && item["Stage"] !== currentUser.AssignedStage) return false; if (currentUser.Role === "Class_Servant" && ((currentUser.AssignedStage !== "الكل" && item["Stage"] !== currentUser.AssignedStage) || (currentUser.AssignedClass !== "الكل" && item["ClassName"] !== currentUser.AssignedClass))) return false; } return Object.values(item).some(val => String(val).toLowerCase().includes(query)); }); document.getElementById('recordCount').innerText = `${filtered.length} سجل`; if (!filtered.length) { container.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 font-semibold bg-white rounded-xl border border-dashed border-slate-300"><i class="fa-regular fa-folder-open text-6xl mb-4 text-slate-300"></i><br>لا توجد بيانات للعرض</div>`; return; } filtered.forEach(item => { const idVal = item[Object.keys(item)[0]]; const card = document.createElement('div'); card.className = "bg-white rounded-xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between"; let details = "", title = item["ChildName"] || item["الاسم ثلاثي"] || item["ServantName"] || item["MemberName"] || "سجل"; if (currentTab === "Names") { details = `<div class="grid grid-cols-2 gap-2 text-sm"><p class="text-slate-600"><i class="fa-solid fa-graduation-cap text-indigo-400 ml-1"></i><span class="font-bold text-indigo-700">${item["المرحلة"] || "-"}</span> | ${item["الصف"] || "-"}</p><p class="text-slate-600"><i class="fa-solid fa-chalkboard-user text-indigo-400 ml-1"></i>${item["فصل مدارس الاحد"] || "-"}</p><p class="text-slate-600 col-span-2"><i class="fa-solid fa-phone text-indigo-400 ml-1"></i>${item["تليفون العمل/المحمول"] || "-"}</p></div>`; } else if (currentTab === "Sunday_School") { details = `<p class="text-sm text-slate-600 mb-2"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-bold">${item["Stage"]}</span> ${item["Grade"]} (${item["ClassName"]})</p><div class="flex justify-between text-sm text-slate-600"><p><i class="fa-regular fa-calendar text-slate-400 ml-1"></i>${item["SessionDate"]}</p><p class="font-bold ${item["Attendance"]==='حاضر'?'text-emerald-600':'text-rose-600'}">${item["Attendance"]}</p></div>`; } else if (currentTab === "Servants") { details = `<p class="text-sm text-slate-600 mb-2">الصلاحية: <span class="font-bold text-indigo-700">${item["Role"]}</span></p><p class="text-sm text-slate-600 mb-1"><i class="fa-solid fa-layer-group text-slate-400 ml-1"></i>${item["AssignedStage"]} - ${item["AssignedGrade"]}</p>`; } else if (currentTab === "Visitations") { details = `<p class="text-sm text-slate-600 mb-2"><i class="fa-solid fa-user-tie text-slate-400 ml-1"></i>الخادم: ${item["VisitorName"]}</p><p class="text-sm text-slate-600"><i class="fa-regular fa-calendar text-slate-400 ml-1"></i>تاريخ الافتقاد: ${item["VisitDate"]}</p>`; } else if (currentTab === "Meetings_Attendance") { details = `<p class="text-sm text-slate-600 mb-2"><i class="fa-solid fa-users-rectangle text-slate-400 ml-1"></i>${item["MeetingName"]}</p><p class="text-sm text-slate-600"><i class="fa-regular fa-calendar text-slate-400 ml-1"></i>التاريخ: ${item["MeetingDate"]}</p>`; } card.innerHTML = `<div><div class="flex justify-between items-start mb-3"><h4 class="font-extrabold text-base text-slate-800 w-3/4 truncate" title="${title}">${title}</h4><span class="text-xs font-mono font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded">#${idVal}</span></div><div class="mb-4">${details}</div></div><div class="flex justify-end gap-2 pt-3 border-t border-slate-100"><button onclick="editRecord(${idVal})" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">تعديل <i class="fa-regular fa-pen-to-square ml-1"></i></button>${currentUser.Role === "Admin" ? `<button onclick="deleteRecord(${idVal})" class="text-sm font-bold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition">حذف <i class="fa-regular fa-trash-can ml-1"></i></button>` : ''}</div>`; container.appendChild(card); }); }
    
    function updateGradeDropdown(stg, grd="") { const sel = document.querySelector('select[name="الصف"], select[name="Grade"], select[name="AssignedGrade"]'); if (!sel) return; const arr = STAGE_GRADES[stg] || []; sel.innerHTML = `<option value="">اختر الصف...</option><option value="الكل">الكل</option>` + arr.map(g => `<option value="${g}" ${g===grd?'selected':''}>${g}</option>`).join(''); }
    function handleGenderChange(v) { const rSel = document.querySelector('select[name="صلة القرابة"]'), mSel = document.querySelector('select[name="الحالة الاجتماعية"]'); if (rSel) { Array.from(rSel.options).forEach(o => { if (v==="ذكر") o.disabled = ["زوجة","ابنة","والدة","أخت"].includes(o.value); else if (v==="انثي") o.disabled = ["زوج","ابن","والد","أخ"].includes(o.value); else o.disabled = false; }); } if (mSel) { Array.from(mSel.options).forEach(o => { if (v==="ذكر") o.disabled = ["متزوجة","انسة","ارملة"].includes(o.value); else if (v==="انثي") o.disabled = ["متزوج","اعزب","ارمل"].includes(o.value); else o.disabled = false; }); } }
    
    function openModal(action, data={}) { document.getElementById('formAction').value = action; document.getElementById('recordId').value = action === 'update' ? data[Object.keys(data)[0]] : ""; document.getElementById('modalTitle').innerHTML = action === 'add' ? `<i class="fa-solid fa-plus-circle text-emerald-600 ml-2"></i> إضافة سجل جديد` : `<i class="fa-solid fa-pen text-amber-500 ml-2"></i> تعديل السجل`; const fCont = document.getElementById('formFields'); fCont.innerHTML = ""; const sc = SCHEMAS[currentTab] || []; sc.forEach(f => { const val = data[f.id] || ""; const w = document.createElement('div'); if (f.full) w.className = "md:col-span-2 lg:col-span-3"; let inpH = ""; const cls = "w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 font-semibold transition"; if (f.type === "stage_select") { inpH = `<select name="${f.id}" onchange="updateGradeDropdown(this.value)" class="${cls}" ${f.required?'required':''}><option value="">اختر المرحلة...</option><option value="الكل">الكل</option>${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`; } else if (f.type === "grade_select") { inpH = `<select name="${f.id}" class="${cls}" ${f.required?'required':''}><option value="">اختر الصف...</option></select>`; } else if (f.type === "select") { const ex = f.id === "ذكر/انثي" ? `onchange="handleGenderChange(this.value)"` : ""; inpH = `<select name="${f.id}" class="${cls}" ${f.required?'required':''} ${ex}>${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o || "---"}</option>`).join('')}</select>`; } else if (f.type === "textarea") { inpH = `<textarea name="${f.id}" rows="2" class="${cls}">${val}</textarea>`; } else { inpH = `<input type="${f.type}" name="${f.id}" value="${val}" ${f.required?'required':''} class="${cls}">`; } w.innerHTML = `<label class="block font-bold mb-1.5 text-slate-700 text-sm">${f.label} ${f.required?'<span class="text-red-500">*</span>':''}</label>${inpH}`; fCont.appendChild(w); }); const stg = data["المرحلة"] || data["Stage"] || data["AssignedStage"] || ""; const grd = data["الصف"] || data["Grade"] || data["AssignedGrade"] || ""; if (stg) updateGradeDropdown(stg, grd); const gen = data["ذكر/انثي"] || ""; if (gen) handleGenderChange(gen); document.getElementById('dataModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('dataModal').classList.add('hidden'); }
    
    async function handleFormSubmit(e) { e.preventDefault(); const action = document.getElementById('formAction').value; const fd = new FormData(e.target); const payload = {}; fd.forEach((v, k) => { if (v.trim()) payload[k] = v; }); if (action === "update") payload[Object.keys(rawData[0])[0]] = Number(document.getElementById('recordId').value); const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin ml-2"></i> جاري الحفظ...`; try { const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ sheet: currentTab, action: action, data: payload }) })).json(); if (res.status === "success") { closeModal(); loadData(); } else alert("خطأ: " + res.message); } catch (err) { alert("حدث خطأ أثناء الحفظ."); } finally { btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-check"></i> حفظ البيانات`; } }
    function editRecord(id) { const item = rawData.find(r => r[Object.keys(r)[0]] == id); if (item) openModal('update', item); }
    async function deleteRecord(id) { if (!confirm(`هل أنت متأكد من حذف السجل رقم #${id} نهائياً؟`)) return; showLoader(true); try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ sheet: currentTab, action: "delete", data: { [Object.keys(rawData[0])[0]]: id } }) }); loadData(); } catch (err) { alert("فشل الحذف"); } finally { showLoader(false); } }
    function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); document.getElementById('dataCardsContainer').classList.toggle('hidden', s); }
</script></body></html>
