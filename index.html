<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الخدمة والرعاية الكنسية</title>
    <link rel="preload" as="video" href="intro.mp4" type="video/mp4">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="flex flex-col min-h-screen bg-slate-50">

<!-- شاشة البداية فيديو -->
<div id="splashScreen" class="fixed inset-0 bg-white z-[9999] flex items-center justify-center overflow-hidden">
    <video id="splashVideo" autoplay muted playsinline preload="auto" class="w-full h-full object-contain pointer-events-none">
        <source src="intro.mp4" type="video/mp4">
    </video>
    <button type="button" onclick="endSplash(event)" class="absolute bottom-8 left-8 text-xs bg-slate-900/80 hover:bg-slate-950 text-white px-5 py-2.5 rounded-full backdrop-blur-md transition z-[10000] font-black shadow-2xl cursor-pointer">
        تخطي ✕
    </button>
</div>

<!-- نافذة تسجيل الدخول -->
<div id="loginScreen" class="fixed inset-0 bg-white/95 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md text-center border border-slate-200">
        <img src="logo.png" alt="Logo" class="max-w-[160px] max-h-[90px] mx-auto object-contain mb-4">
        
        <h2 class="text-2xl font-black text-slate-800 mb-1">بوابة الخدام</h2>
        <p class="text-xs text-slate-500 mb-6 font-bold">تسجيل الدخول لمنظومة الرعاية والخدمة</p>
        
        <form onsubmit="handleLogin(event)" class="space-y-4 text-right">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">اختر اسم الخادم</label>
                <select id="loginUser" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold text-slate-700">
                    <option value="admin">أبونا الكاهن / الأدمن (admin)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">كلمة المرور</label>
                <div class="relative flex items-center">
                    <input type="password" id="loginPass" required autocomplete="new-password" placeholder="أدخل كلمة المرور..." class="w-full pr-4 pl-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-semibold">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute left-3 text-slate-400 hover:text-indigo-600 transition p-1">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="loginBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow-md transition duration-200 text-sm mt-2">تسجيل الدخول</button>
            <p id="loginError" class="text-xs text-rose-600 font-bold hidden text-center"></p>
        </form>
    </div>
</div>

<!-- الهيدر العلوي -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="Logo" class="max-w-[120px] max-h-[45px] object-contain">
            <div>
                <h1 class="text-base font-black text-slate-800 leading-tight">منظومة الخدمة والرعاية الكنسية</h1>
                <p class="text-xs text-slate-500 font-bold" id="userBadge"></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="showDashboard()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition">الرئيسية</button>
            <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-xl text-xs font-bold transition">خروج</button>
        </div>
    </div>
</header>

<main class="flex-grow w-full max-w-7xl mx-auto px-4 py-8">
    <div id="dashboardView" class="block">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-slate-800 mb-2">لوحة التحكم المركزية</h2>
            <p class="text-slate-500 font-bold text-sm">حدد القسم للمتابعة والتسجيل</p>
        </div>
        <div id="dashboardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-5xl mx-auto"></div>
    </div>

    <div id="dataView" class="hidden">
        
        <!-- الترويسة المخصصة للطباعة الرسمية -->
        <div id="churchPrintHeader" class="hidden print:flex print-header">
            <div class="text-right">
                <h2 class="text-sm font-black text-slate-900 leading-tight mb-0.5">كنيسة العذراء مريم والشهيدة بربارة</h2>
                <p class="text-[8.5pt] font-bold text-slate-600">منظومة الخدمة والرعاية الكنسية</p>
                <p id="printReportTitle" class="text-[9pt] font-black text-indigo-950 mt-0.5"></p>
            </div>
            <img src="logo.png" alt="Logo" class="max-w-[55px] max-h-[45px] object-contain">
            <div class="text-left text-[8pt] font-bold text-slate-600">
                <p>تاريخ الطباعة: <span id="printCurrentDate"></span></p>
                <p>المشرف: <span id="printServantName"></span></p>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 no-print">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <h2 id="currentTabTitle" class="text-2xl font-black text-slate-800"></h2>
                <span id="recordCount" class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-1 rounded-lg font-bold text-xs">0 سجل</span>
            </div>
            
            <!-- أزرار تبديل قسم الأعضاء -->
            <div id="namesViewSwitcher" class="flex items-center gap-2 bg-slate-200/80 p-1 rounded-xl hidden">
                <button id="btnViewRoster" onclick="switchNamesView('roster')" class="px-4 py-2 rounded-lg text-xs font-black transition bg-white text-indigo-700 shadow-sm">
                    🗂️ كشف أرباب الأسر (أبجد
